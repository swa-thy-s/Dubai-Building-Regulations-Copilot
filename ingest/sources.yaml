# One entry per document. PDFs live in data/raw/ (gitignored).
# Fields marked TODO need confirming against the official source before ingestion.
documents:
  - slug: dbc-2021
    title: Dubai Building Code
    authority: DM
    edition: "2021"
    status: current
    source_url: null # TODO: official dm.gov.ae link
    pdf_path: "data/raw/Dubai Building Code_English_2021 Edition.pdf"

  - slug: dbc-circular
    title: Dubai Building Code Circular
    authority: DM
    edition: "17 Jan 2022 (ref DP-VP-CS-GEN-0008-2022)" # from the letter itself
    status: current
    source_url: null
    # Step 6 (2026-10-17): parses to 1 chunk with the numbered adapter. Ready to ingest.
    pdf_path: "data/raw/Dubai Building Code Circular EN.pdf"
    kind: numbered
    numbered:
      clause_re: '^(?!)$' # a one-page letter: no numbered clauses, keep the text as one chunk
      front_prefix: Circular
      front_type: clause

  - slug: alsafat-2023
    title: Al Sa'fat Dubai Green Building System
    authority: DM
    edition: "2nd ed. 2023"
    status: current
    source_url: null
    # Step 6 (2026-10-17): parses to 132 chunks (102 articles like 301.01, plus definitions as per-page chunks). Pages are
    # stamped "SHARED - CONFIDENTIAL": owner asked for it to be indexed; confirm quoting rights before any public launch.
    pdf_path: "data/raw/Al-Safat-–-Dubai-Green-Building-System-2nd-editionJan2023.pdf"
    kind: numbered
    numbered:
      first_page: 2
      front_prefix: Introduction
      clause_start_page: 34 # pages 2-33: definitions, structure and the summary table; clauses start at 301.01
      clause_re: '^(\d{3}\.\d{2})\s+(\S.*)$'
      chapter_re: '^\d{3}:\s+\S'
      noise_res: ['SHARED\s*[–-]\s*CONFIDENTIAL', '^Al Sa.fat']

  - slug: dbc-wind
    title: Dubai Wind Code
    authority: DM
    edition: "Draft Copy 2013" # cover says "Draft Copy, Dubai Municipality 2013"
    status: current
    source_url: null
    pdf_path: "data/raw/DubaiWindCode6-2.pdf"
    kind: numbered
    repair_ligatures: true
    numbered:
      first_page: 3
      clause_re:
        - '^(\d+)\.\s+([A-Z][A-Z ,\-/()]{2,70})$'
        - '^(\d+(?:\.\d+){1,3})\.?\s+([A-Z][A-Za-z ,\-/()]{2,70})$'
      noise_res: ['\.{4,}', '^Dubai Wind Code', 'Draft Copy']
    # Step 6 (2026-10-17): parses to 30 chunks. It is a DRAFT (edition badge reads "Draft Copy 2013"). Equations extract
    # as fragments, so formulas are unreliable; prose and stated values are fine.

  - slug: dbc-seismic
    title: Seismic Design Code for Dubai
    authority: DM
    edition: TODO
    status: current
    source_url: null
    pdf_path: "data/raw/DB_SEISMIC-DESIGN-CODEF-OR-DUBAI.pdf"
    # Step 6 (2026-10-17): NOT INDEXED. The text layer uses a shifted font encoding. A +29 shift recovers letters and
    # digits, but stray "A" glyphs stand in for spaces, ")" often comes out as "=", symbols (>=, Greek) are lost and
    # equations are unreadable. Verbatim quotes would be wrong. Needs OCR or an official clean PDF.

  - slug: dbc-structural
    title: Structural Codes Guidelines
    authority: DM
    edition: TODO
    status: current
    source_url: null
    pdf_path: "data/raw/StructuralCodesguidelines4-2.pdf"
    # Step 6 (2026-10-17): NOT INDEXED. 6 pages, scanned images; the cover is bilingual but the body is Arabic. No OCR
    # available locally. Needs Arabic OCR plus a decision on indexing non-English text.

  - slug: dbc-soil
    title: Soil Testing Guidelines
    authority: DM
    edition: TODO
    status: current
    source_url: null
    pdf_path: "data/raw/SoiltestingGuidelines3-2.pdf"
    # Step 6 (2026-10-17): NOT INDEXED. 3 pages, scanned Arabic. Same as dbc-structural.

  - slug: dubai-real-estate-legislation
    kind: legislation # one documents row per law; slug derived from the TOC (e.g. law-27-2007)
    title: Dubai Real Estate Legislation
    authority: RERA
    edition: "2014 compilation" # (c) 2014 Government of Dubai Legal Affairs Department
    status: current
    source_url: null
    repair_ligatures: true # PDF text layer drops fi/fl ligatures; repaired with a dictionary, see ingest/ligatures.py
    pdf_path: "data/raw/Real_Estate_Legislation_en.pdf"

# Module 2 (later): data/raw/Real_Estate_Legislation_en.pdf -> authority RERA
# data/raw/Sustainable-Dubai.pdf: NOT INDEXED. It is "A Sustainable Dubai: The Dubai Municipality Report 2016", an annual report,
# not a regulation. It has no clauses to cite, and indexing it would let report statistics sit beside binding rules.
